spring.application.name=billing

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console (useful for local debugging)
spring.h2.console.enabled=true

# Dispatcher settings
billing.dispatcher.poll-interval-ms=250
billing.dispatcher.batch-size=10
billing.dispatcher.lease-duration-seconds=10
billing.dispatcher.max-in-flight-per-endpoint=4
billing.dispatcher.http-timeout-seconds=30

# Retry schedule: attempt 1 immediately, then 1s / 5s / 25s / 2m / 10m backoff
billing.retry.max-attempts=5
billing.retry.schedule-seconds=1,5,25,120,600
billing.retry.jitter-ratio=0.2

# Endpoint health policy
billing.health.window-size=10
billing.health.degraded-failures=3
billing.health.tripped-failures=7
billing.health.tripped-consecutive=5
billing.health.tripped-cooldown-seconds=60
