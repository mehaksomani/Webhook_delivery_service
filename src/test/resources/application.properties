spring.application.name=billing

# H2 in-memory datasource — separate name from main so a parallel boot run can't collide.
spring.datasource.url=jdbc:h2:mem:billing-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.h2.console.enabled=false

# Dispatcher tuned for fast test iteration. Lease stays 10s so the natural
# expiry doesn't race with S6's manual back-date simulation; the recovery
# sweep still runs every poll-interval-ms.
billing.dispatcher.poll-interval-ms=100
billing.dispatcher.batch-size=10
billing.dispatcher.lease-duration-seconds=10
billing.dispatcher.max-in-flight-per-endpoint=4
billing.dispatcher.http-timeout-seconds=10

# Compressed retry schedule. Four attempts (one initial + three retries),
# 1-second slots, no jitter — so S3 dead-letters in ~3s and the await timeout fits.
billing.retry.max-attempts=4
billing.retry.schedule-seconds=1,1,1
billing.retry.jitter-ratio=0

# Health policy matches design.md.
billing.health.window-size=20
billing.health.degraded-failures=3
billing.health.tripped-failures=10
billing.health.tripped-consecutive=5
billing.health.tripped-cooldown-seconds=60
