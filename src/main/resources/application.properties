spring.application.name=billing

# H2 in-memory datasource
spring.datasource.url=jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# H2 console is an unauthenticated SQL console — keep it OFF by default.
# Enable it only for local debugging via the 'dev' profile
# (./gradlew bootRun --args='--spring.profiles.active=dev').
spring.h2.console.enabled=false

# Dispatcher settings
billing.dispatcher.poll-interval-ms=250
billing.dispatcher.batch-size=10
billing.dispatcher.lease-duration-seconds=10
billing.dispatcher.max-in-flight-per-endpoint=4
billing.dispatcher.http-timeout-seconds=30

# Retry schedule: attempt 1 immediately, then 1s / 5s / 25s / 2m / 10m backoff
billing.retry.max-attempts=5
billing.retry.schedule-seconds=1,5,25,120,600

# Endpoint health policy: UNHEALTHY at >=10 failures in the last 20 attempts,
# or >=5 consecutive failures; otherwise HEALTHY.
billing.health.window-size=20
billing.health.failure-threshold=10
billing.health.consecutive-threshold=5

# SSRF guard for delivery targets. Only http/https targets are allowed, and
# (with block-private-addresses on) hosts that resolve to loopback, link-local
# (incl. the 169.254.169.254 cloud-metadata endpoint), or RFC-1918 addresses
# are rejected at registration and re-checked at delivery time.
billing.security.allowed-schemes=http,https
billing.security.block-private-addresses=true
