# Simulation profile — for the end-to-end scenario driver in tools/simulate.py.
# Activate with:
#   ./gradlew bootRun --args='--spring.profiles.active=sim'
#
# Differs from the production defaults in two ways that the simulation needs:
#   1. block-private-addresses=false  — the mock receiver runs on 127.0.0.1, which
#      the SSRF guard would otherwise reject. NEVER ship this to a deployed env.
#   2. compressed retry/lease timings  — so dead-lettering and crash recovery are
#      observable in seconds instead of minutes.

spring.application.name=billing

# H2 in-memory; restart wipes state.
spring.datasource.url=jdbc:h2:mem:billing-sim;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Snappy dispatch + short lease so the crash-recovery sweep fires within seconds.
billing.dispatcher.poll-interval-ms=200
billing.dispatcher.batch-size=10
billing.dispatcher.lease-duration-seconds=5
billing.dispatcher.max-in-flight-per-endpoint=4
billing.dispatcher.http-timeout-seconds=30

# Four attempts (one initial + three retries) on a 1s/2s/2s backoff, so an
# always-failing endpoint dead-letters in ~5s.
billing.retry.max-attempts=4
billing.retry.schedule-seconds=1,2,2

# Health policy as in design.md.
billing.health.window-size=20
billing.health.failure-threshold=10
billing.health.consecutive-threshold=5

# SSRF guard: scheme allow-list still applies, but private-address blocking is
# OFF so the local mock receiver on 127.0.0.1 is a valid delivery target.
billing.security.allowed-schemes=http,https
billing.security.block-private-addresses=false
